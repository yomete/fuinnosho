# pnpm >= 10 reads overrides, peerDependencyRules and packageExtensions from
# here. They were previously in the "pnpm" field of package.json, which pnpm
# silently ignores, so these security pins were not being enforced.

# Two rules when editing these pins:
#
#   1. Pin to the HIGHEST version any advisory requires. Several packages carry
#      multiple advisories with different thresholds, so taking the lowest
#      leaves the rest unfixed.
#   2. Bound every pin to the major already in the tree. A bare ">=x.y.z" lets
#      pnpm pull the next major — ">=7.3.5" silently installed vite 8 — which
#      is a breaking upgrade wearing a security patch's clothes.
#
# Packages whose consumers span several majors need per-range keys instead of
# one blanket pin; see the ajv and picomatch entries below.
overrides:
  "@babel/core": ">=7.29.6 <8"
  "@hono/node-server": ">=2.0.5 <3"
  "@modelcontextprotocol/sdk": ">=1.25.2 <2"
  "@opentelemetry/core": ">=2.8.0 <3"
  axios: ">=1.13.6 <2"
  body-parser: ">=2.3.0 <3"
  esbuild: ">=0.28.1 <0.29"
  fast-uri: ">=3.1.1 <4"
  flatted: ">=3.4.2 <4"
  form-data: ">=4.0.6 <5"
  hono: ">=4.12.12 <5"
  ip-address: ">=10.1.1 <11"
  js-yaml: ">=4.2.0 <5"
  lodash: ">=4.18.0 <5"
  next: ">=16.2.3 <17"
  path-to-regexp: ">=8.4.0 <9"
  postcss: ">=8.5.10 <9"
  qs: ">=6.15.2 <7"
  rollup: ">=4.59.0 <5"
  sharp: ">=0.35.0 <0.36"
  vite: ">=7.3.5 <8"
  ws: ">=8.20.1 <9"
  yaml: ">=2.8.3 <3"
  # ajv keeps per-range pins: consumers sit on both 6.x and 8.x, and forcing
  # everything to 8 breaks @eslint/eslintrc, which uses the ajv 6
  # `missingRefs` API.
  "ajv@<6.14.0": ">=6.14.0 <7"
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0 <9"
  # minimatch 3.x is pulled off the old line entirely. Leaving it on 3.x pins
  # brace-expansion to 1.x, whose whole line is unpatchable against
  # GHSA "<=5.0.7" — there is no 1.x release above 5.0.7 to move to.
  minimatch: ">=10 <11"
  brace-expansion: ">=5.0.8 <6"
  "picomatch@<3": ">=2.3.2 <3"
  "picomatch@>=4": ">=4.0.4 <5"

peerDependencyRules:
  allowedVersions:
    "mcp-handler>@modelcontextprotocol/sdk": "^1.27.1"
    "react-grid-heatmap>react": "^19.0.0"

packageExtensions:
  # mcp-handler 1.1.0 pins its @modelcontextprotocol/sdk peer to exactly
  # "1.26.0"; widen it so the override to >=1.25.2 <2 does not conflict.
  "mcp-handler@1.1.0":
    peerDependencies:
      "@modelcontextprotocol/sdk": ">=1.25.2 <2.0.0"
  "react-grid-heatmap@1.3.0":
    peerDependencies:
      react: "^17 || ^18 || ^19"
